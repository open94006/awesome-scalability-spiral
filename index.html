<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f4f3" />
    <meta name="description" content="916 篇系統設計經典文章的繁中重點，由淺入深學分散式系統、準備面試。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:site_name" content="系統設計學習網" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:image" content="https://open94006.github.io/awesome-scalability-spiral/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
    <script>
      // 在畫面繪出前先決定深淺色，避免深色使用者看到白畫面閃一下
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0f171b' : '#f1f4f3');
      })();
    </script>
    <title>系統設計學習網｜繁中重點，從分散式系統到面試</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
